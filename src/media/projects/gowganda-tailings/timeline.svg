<svg width="750" height="510" viewBox="0 0 750 510" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,Helvetica,sans-serif;background:#fff">
<title>Gowganda Silver Tailings: Four Decades of Technical Work</title>

<!-- Central vertical line -->
<line x1="90" y1="40" x2="90" y2="440" stroke="#E8D5B5" stroke-width="2"/>

<!-- Node 1: WGM 1981 -->
<circle cx="90" cy="55" r="8" fill="#2D2D2D" stroke="#fff" stroke-width="2"/>
<text x="120" y="51" font-weight="700" font-size="15" fill="#2D2D2D" dominant-baseline="central">1981</text>
<text x="120" y="71" font-size="12" fill="#555" font-weight="600">Watts, Griffis and McOuat</text>
<text x="120" y="87" font-size="11" fill="#777">545 auger + 26 drive pipe holes (1,570 m). ~1.7M tons at 1.45 oz/t Ag.</text>
<text x="120" y="102" font-size="11" fill="#777">82% silver recovery confirmed via cyanide leach (Lakefield Research).</text>

<!-- Node 2: Kilborn 1987 -->
<circle cx="90" cy="150" r="8" fill="#2D2D2D" stroke="#fff" stroke-width="2"/>
<text x="120" y="146" font-weight="700" font-size="15" fill="#2D2D2D" dominant-baseline="central">1987</text>
<text x="120" y="166" font-size="12" fill="#555" font-weight="600">Kilborn Limited feasibility study</text>
<text x="120" y="182" font-size="11" fill="#777">152 sonic holes (910 m). 1,000 TPD process design. 85%+ recovery.</text>
<text x="120" y="197" font-size="11" fill="#777">Financial projections at US $6-12/oz Ag. 49.3% IRR at $12.</text>
<text x="120" y="212" font-size="10" fill="#999" font-style="italic">Canadian Mining Hall of Fame engineering firm (acq. SNC-Lavalin, 1996)</text>

<!-- Node 3: Sandy K 2000 -->
<circle cx="90" cy="262" r="8" fill="#2D2D2D" stroke="#fff" stroke-width="2"/>
<text x="120" y="258" font-weight="700" font-size="15" fill="#2D2D2D" dominant-baseline="central">2000</text>
<text x="120" y="278" font-size="12" fill="#555" font-weight="600">Sandy K Mines sonic drill program</text>
<text x="120" y="294" font-size="11" fill="#777">32 holes in core area. Average 2.0 oz/t Ag (40% above deposit mean).</text>
<text x="120" y="309" font-size="11" fill="#777">Concluded earlier resource underestimated by minimum 25%.</text>

<!-- Node 4: GeoVector 2011 -->
<circle cx="90" cy="358" r="8" fill="#2D2D2D" stroke="#fff" stroke-width="2"/>
<text x="120" y="354" font-weight="700" font-size="15" fill="#2D2D2D" dominant-baseline="central">2011</text>
<text x="120" y="374" font-size="12" fill="#555" font-weight="600">GeoVector NI 43-101 resource estimate (for Temex Resources)</text>
<text x="120" y="390" font-size="11" fill="#777">764 holes integrated. Indicated: 1.94M t at 47.5 g/t Ag = 2.96M oz.</text>
<text x="120" y="405" font-size="11" fill="#777">Temex metallurgical testing: 80%+ recovery via thiosulfate leach.</text>

<!-- Node 5: Nord 2026 (merged with BMR) -->
<circle cx="90" cy="448" r="10" fill="#DF9E3A" stroke="#fff" stroke-width="2.5"/>
<text x="120" y="440" font-weight="700" font-size="15" fill="#DF9E3A" dominant-baseline="central">2026</text>
<text x="120" y="460" font-size="12" fill="#555" font-weight="600">Nord / GeoVector MRE update</text>
<text x="120" y="476" font-size="11" fill="#777">860+ holes (incl. 103 BMR sonic holes), consolidated land package, silver above US $80.</text>

<!-- Source footer -->
<text x="90" y="500" font-size="9" fill="#bbb" dominant-baseline="central">Sources: WGM (1981), Kilborn Ltd (1987), Sandy K Mines (2000), GeoVector/Temex (2011). All reports publicly available.</text>

</svg>

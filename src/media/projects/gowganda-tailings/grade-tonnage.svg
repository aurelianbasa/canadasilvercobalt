<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,Helvetica,sans-serif;background:#fff">
<title>GeoVector 2011: Grade-Tonnage Sensitivity, Indicated Resource</title>

<!-- Chart area -->
<rect x="80" y="25" width="540" height="300" fill="#FAFAF8" rx="2"/>

<!-- Flat zone highlight -->
<rect x="80" y="25" width="232" height="300" fill="rgba(223,158,58,0.06)" rx="2"/>

<!-- Y-axis grid -->
<line x1="80" y1="325" x2="620" y2="325" stroke="#E0DDD8" stroke-width="0.75"/>
<line x1="80" y1="188.6" x2="620" y2="188.6" stroke="#F0EDEA" stroke-width="0.5"/>
<line x1="80" y1="52.3" x2="620" y2="52.3" stroke="#F0EDEA" stroke-width="0.5"/>

<!-- Y-axis labels (tonnes, left) -->
<text x="72" y="329" text-anchor="end" font-size="10" fill="#2D2D2D">0</text>
<text x="72" y="193" text-anchor="end" font-size="10" fill="#2D2D2D">1.0M</text>
<text x="72" y="56" text-anchor="end" font-size="10" fill="#2D2D2D">2.0M</text>
<text x="16" y="188" text-anchor="middle" font-size="10" fill="#2D2D2D" transform="rotate(-90,16,188)">Tonnes</text>

<!-- Y1-axis labels (contained oz, right) -->
<text x="628" y="329" text-anchor="start" font-size="10" fill="#DF9E3A">0</text>
<text x="628" y="240" text-anchor="start" font-size="10" fill="#DF9E3A">1.0M oz</text>
<text x="628" y="154" text-anchor="start" font-size="10" fill="#DF9E3A">2.0M oz</text>
<text x="628" y="68" text-anchor="start" font-size="10" fill="#DF9E3A">3.0M oz</text>
<text x="700" y="188" text-anchor="middle" font-size="10" fill="#DF9E3A" transform="rotate(90,700,188)">Contained silver ounces</text>

<!-- X-axis labels -->
<text x="96" y="343" text-anchor="middle" font-size="10" fill="#666">5</text>
<text x="176" y="343" text-anchor="middle" font-size="10" fill="#666">10</text>
<text x="256" y="343" text-anchor="middle" font-size="10" fill="#666">20</text>
<text x="336" y="343" text-anchor="middle" font-size="10" fill="#666">30</text>
<text x="416" y="343" text-anchor="middle" font-size="10" fill="#666">40</text>
<text x="496" y="343" text-anchor="middle" font-size="10" fill="#666">50</text>
<text x="588" y="343" text-anchor="middle" font-size="10" fill="#666">100</text>
<text x="340" y="365" text-anchor="middle" font-size="10" fill="#999">Silver cutoff grade (g/t Ag)</text>

<!-- TONNES LINE (charcoal, thick) -->
<polygon points="96,60 176,61 256,66 336,87 416,173 496,253 588,315 588,325 96,325" fill="rgba(45,45,45,0.06)" stroke="none"/>
<polyline points="96,60 176,61 256,66 336,87 416,173 496,253 588,315" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

<circle cx="96" cy="60" r="6" fill="#2D2D2D"/>
<circle cx="176" cy="61" r="6" fill="#2D2D2D"/>
<circle cx="256" cy="66" r="6" fill="#2D2D2D"/>
<circle cx="336" cy="87" r="5" fill="#2D2D2D"/>
<circle cx="416" cy="173" r="5" fill="#2D2D2D"/>
<circle cx="496" cy="253" r="5" fill="#2D2D2D"/>
<circle cx="588" cy="315" r="5" fill="#2D2D2D"/>

<!-- CONTAINED OZ LINE (Nord gold, thick) -->
<polyline points="96,71 176,71 256,73 336,85 416,147 496,217 588,298" fill="none" stroke="#DF9E3A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

<circle cx="96" cy="71" r="6" fill="#DF9E3A"/>
<circle cx="176" cy="71" r="6" fill="#DF9E3A"/>
<circle cx="256" cy="73" r="6" fill="#DF9E3A"/>
<circle cx="336" cy="85" r="5" fill="#DF9E3A"/>
<circle cx="416" cy="147" r="5" fill="#DF9E3A"/>
<circle cx="496" cy="217" r="5" fill="#DF9E3A"/>
<circle cx="588" cy="298" r="5" fill="#DF9E3A"/>

<!-- LABELS: only at 5 g/t (start of flat), 20 g/t (end of flat), and 100 g/t (endpoint) -->
<!-- White background rects prevent overlap with lines -->

<!-- 5 g/t labels — right of dots -->
<rect x="108" y="47" width="50" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="110" y="58" text-anchor="start" font-size="10" fill="#2D2D2D" font-weight="700">1.95M t</text>
<rect x="108" y="76" width="54" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="110" y="87" text-anchor="start" font-size="10" fill="#C4862E" font-weight="700">2.96M oz</text>

<!-- 20 g/t labels — right of dots -->
<rect x="268" y="53" width="50" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="270" y="64" text-anchor="start" font-size="10" fill="#2D2D2D" font-weight="700">1.90M t</text>
<rect x="268" y="78" width="54" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="270" y="89" text-anchor="start" font-size="10" fill="#C4862E" font-weight="700">2.94M oz</text>

<!-- 100 g/t labels — right of dots, stacked clearly -->
<rect x="598" y="288" width="50" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="600" y="299" text-anchor="start" font-size="9" fill="#C4862E" font-weight="600">0.31M oz</text>
<rect x="598" y="308" width="44" height="13" rx="2" fill="#fff" opacity="0.9"/>
<text x="600" y="319" text-anchor="start" font-size="9" fill="#2D2D2D" font-weight="600">0.07M t</text>

<!-- Flat zone annotation — above chart to avoid any data overlap -->
<text x="196" y="17" text-anchor="middle" font-size="11" fill="#C4862E" font-weight="700">Resource holds steady from 5 to 20 g/t cutoff</text>

<!-- Legend -->
<circle cx="90" cy="391" r="5" fill="#2D2D2D"/>
<text x="100" y="395" font-size="10" fill="#555">Tonnes</text>
<circle cx="170" cy="391" r="5" fill="#DF9E3A"/>
<text x="180" y="395" font-size="10" fill="#555">Contained silver ounces</text>

<!-- Source -->
<text x="80" y="418" font-size="8.5" fill="#BBB">Source: GeoVector Management Inc., NI 43-101 Technical Report, July 8, 2011 (Table 4). Indicated Mineral Resource category.</text>

</svg>
